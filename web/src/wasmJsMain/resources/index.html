<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competra</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        canvas { display: block; width: 100% !important; height: 100% !important; }

        :root {
            --loader-bg: #121A15;
            --loader-accent: #7FCFA0;
            --loader-track: rgba(127, 207, 160, 0.25);
        }
        @media (prefers-color-scheme: light) {
            :root {
                --loader-bg: #F4F1E8;
                --loader-accent: #2E5D43;
                --loader-track: rgba(46, 93, 67, 0.25);
            }
        }

        /* Пока wasm-бандл (~5 МБ) грузится и компилируется, body пуст — без этого экран выглядит
         * так, будто приложение сломалось, а не просто грузится (см. историю с ложной тревогой
         * о "не работает веб-версия"). Оверлей снимается сам, как только Compose примонтирует
         * canvas — см. скрипт ниже. */
        #loading-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: var(--loader-bg);
            z-index: 9999;
        }
        #loading-overlay .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--loader-track);
            border-top-color: var(--loader-accent);
            border-radius: 50%;
            animation: loading-spin 0.8s linear infinite;
        }
        #loading-overlay span {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            color: var(--loader-accent);
        }
        @keyframes loading-spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div id="loading-overlay"><div class="spinner"></div><span>Загрузка…</span></div>
<script src="competra.js"></script>
<script>
    (function () {
        var overlay = document.getElementById("loading-overlay");
        var observer = new MutationObserver(function () {
            if (document.querySelector("canvas")) {
                overlay.remove();
                observer.disconnect();
            }
        });
        observer.observe(document.body, { childList: true, subtree: true });
    })();
</script>
</body>
</html>
